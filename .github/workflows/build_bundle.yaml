name: Woody checks and images
on:
  pull_request:
  push:
    branches: [2.x]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested images to this repository owner's GHCR namespace
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: yarn
          cache-dependency-path: ui/yarn.lock
      - run: corepack yarn install --frozen-lockfile --non-interactive --ignore-engines
        working-directory: ui
      - run: corepack yarn test-ci --runInBand
        working-directory: ui
        env:
          CI: 'true'
      - run: corepack yarn build
        working-directory: ui
        env:
          CI: 'false'
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t woody-studio:test services/studio
      - run: docker run --rm woody-studio:test python -m pytest tests -q -o cache_dir=/tmp/pytest-cache
  chatbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: services/chatbot/package-lock.json
      - run: npm ci && npm run typecheck && npm test
        working-directory: services/chatbot
  bundle:
    needs: [ui, studio, chatbot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t woody-bundle:test .
  images:
    needs: [ui, studio, chatbot, bundle]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: ''
            context: .
          - name: '-studio'
            context: services/studio
          - name: '-chatbot'
            context: services/chatbot
    steps:
      - uses: actions/checkout@v4
      - id: registry
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          repository="${repository%-}"
          echo "image=ghcr.io/${repository}${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: |
            ${{ steps.registry.outputs.image }}:woody-${{ github.sha }}
            ${{ steps.registry.outputs.image }}:woody-latest
